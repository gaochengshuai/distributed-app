version: '3.8'
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: g478523241
      MYSQL_DATABASE: payment
      MYSQL_USER: root
      MYSQL_PASSWORD: g478523241
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: 123456
volumes:
  db_data:
